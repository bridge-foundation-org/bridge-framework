[workspace]
resolver = "2"
members = [
    "protocol",
    "compiler",
    "codegen",
    "db",
    "miniredis",
    "daemon",
    "cli",
    "sdk-rust",
    "e2e-tests",
    "scripts/analyze-commits",
]

[workspace.package]
version     = "0.2.0"
edition     = "2021"
authors     = ["Bridge Framework Contributors"]
license     = "MIT"
repository  = "https://github.com/yourusername/bridge-framework"
description = "Lightweight, Encore-inspired framework for building type-safe backend services"
